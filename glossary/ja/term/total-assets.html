<h1>総資産 <span class="reading">そうしさん</span></h1>
<p class="lead">会社が持っているものすべての合計</p>
<h2>くわしく</h2><p>現金・在庫・工場・のれんまで、会社が持つものを金額に直して合計したものです。自己資本と負債を足した金額と必ず一致します。これに対してどれだけ稼げたかを見るのがROAです。</p>
<h2>具体例</h2><p>自己資本40億円と負債60億円を足すと、総資産は100億円です。</p>
