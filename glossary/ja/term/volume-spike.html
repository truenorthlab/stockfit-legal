<h1>出来高急増 <span class="reading">できだかきゅうぞう</span></h1>
<p class="lead">普段よりはるかに多く売買された状態</p>
<h2>くわしく</h2><p>平常時の何倍もの株数が動いた日のことです。決算や重要な発表など、多くの人が同時に判断を変えた合図と読めます。値動きだけを見ていると気づかない変化が、ここに現れることがあります。</p>
<h2>具体例</h2><p>平均10万株の銘柄で、ある日100万株が動けば10倍の急増です。</p>
