<h1>売買代金 <span class="reading">ばいばいだいきん</span></h1>
<p class="lead">その日に取引された金額の合計</p>
<h2>くわしく</h2><p>出来高に値段を掛けた金額で、どれだけのお金が動いたかを表します。株数だけを見る出来高と違い、値段の高い銘柄と安い銘柄を同じものさしで比べられます。市場全体の勢いを測るときにもよく使われます。</p>
<h2>具体例</h2><p>1,000円の株が100万株動けば、売買代金は10億円です。</p>
