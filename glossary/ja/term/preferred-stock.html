<h1>優先株と普通株 <span class="reading">ゆうせんかぶとふつうかぶ</span></h1>
<p class="lead">配当や議決権の条件が違う二種類の株</p>
<h2>くわしく</h2><p>普通株は議決権を持ち、配当は業績次第で変わります。優先株は配当を先に受け取れる代わりに、議決権がないことが多い株です。市場で個人が売買するのはほとんどが普通株です。</p>
<h2>具体例</h2><p>優先株に年5%の配当が約束され、普通株の配当は業績で0にもなります。</p>
