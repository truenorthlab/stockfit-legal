<h1>損益分岐点 <span class="reading">そんえきぶんきてん</span></h1>
<p class="lead">利益がちょうどゼロになる売上高</p>
<h2>くわしく</h2><p>固定費を、売上から変動費を引いた割合で割って求めます。この金額を超えたところから利益が出ます。固定費が重い会社は分岐点が高く、売上が少し減っただけで赤字に落ちやすくなります。</p>
<h2>具体例</h2><p>固定費4億円で粗利率40%なら、分岐点の売上は10億円です。</p>
